<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 Todos vs Uno - Filter y Find</title>
</head>

<body>
  <h1>🎯 Todos vs Uno</h1>
  <h5>Filter y Find | Abre la consola para ver resultados</h5>

  <script>
    const guardians = [45, 78, 92, 60, 88, 55, 95];

    const eliteGuardians = guardians.filter(power => power > 70);
    const firstLegendary = guardians.find(power => power > 90);

    console.log(guardians);
    console.log(eliteGuardians);
    console.log(firstLegendary);

    console.log(eliteGuardians.length === 4);
    console.log(firstLegendary === 92);
    console.log(Array.isArray(eliteGuardians) === true);
    console.log(guardians.length === 7);
    console.log(typeof firstLegendary === 'number');
  </script>
</body>

</html>
