<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📋 Lista de Héroes I Array of Objects</title>
</head>

<body>
  <h1>📋 Lista de Héroes I Array of Objects</h1>
  <h5>Array of Objects | Abre la consola para ver resultados</h5>
  <script>
    const heroes = [
      { name: 'Elliot', level: 92 },
      { name: 'Fernanda', level: 88 },
    ];

    console.log(heroes);
    console.log(heroes[1]);
    console.log(heroes[1].name);

    console.log(heroes.length);
    heroes.push({ name: 'Mijael', level: 95 });
    console.log(heroes.length);

    console.log('--- Test cases  ---');
    console.log(heroes.length === 3);
    console.log(heroes[0].name === 'Elliot');
    console.log(heroes[0].level === 92);
    console.log(heroes[2].name === 'Mijael');
    console.log(Array.isArray(heroes) === true);
  </script>
</body>

</html>
