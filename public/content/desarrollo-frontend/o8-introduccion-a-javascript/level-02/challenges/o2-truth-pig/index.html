<!DOCTYPE html>

<head>

  <title>⚡ Convertidor Relámpago 💫</title>

<body>
  <h1>⚡ Convertidor Relámpago 💫</h1>
  <h5>🎯 Usa el operador + mágico para convertir valores al instante ✨</h5>
  <script>
    const input = prompt('Dile algo al chanchito:');
    const converted = +input;
    alert(converted ? '¡OINK! VERDAD 🟢' : '¡OINK! MENTIRA 🔴');
  </script>
</body>
