<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧪 Laboratorio de Pociones Mágicas ✨</title>
</head>

<body>
  <h1>🧪 Laboratorio de Pociones Mágicas ✨</h1>
  <h5>🔮 Convierte ingredientes al tipo correcto para crear pociones épicas 🧙‍♀️</h5>

  <script>
    const invisibilityDuration = '30';
    const strengthLevel = 8;
    const isActive = 1;

    // Convert each ingredient to the correct type
    // Create a potion
    const invisibilityDurationNumber = Number(invisibilityDuration);
    const strengthLevelString = String(strengthLevel);
    const isActiveBoolean = Boolean(isActive);
    // Create a message showing all three potions are ready
    // Show with console.log()
    console.log('Poción lista:', invisibilityDurationNumber + ' minutos');
    console.log('Poción lista:', strengthLevelString + ' puntos de fuerza');
    console.log('Poción lista:', isActiveBoolean + ' velocidad activa');

    console.log(typeof invisibilityDurationNumber == 'number');
  </script>
</body>

</html>
