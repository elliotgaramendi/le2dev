<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚖️ Tribunal de la Igualdad 🐕</title>
</head>

<body>
  <h1>⚖️ Tribunal de la Igualdad 🐕</h1>
  <h5>👨‍⚖️ Chocolate juzga: ¿Son realmente iguales? === vs == 🔍</h5>

  <script>
    const num = 8;
    const str = '8';
    const zero = 0;
    const bool = false;
    // Compare num === str
    console.log(num === str);
    // Compare num == str
    console.log(num == str);
    // Compare zero === bool
    console.log(zero === bool);
    // Compare zero == bool
    console.log(zero == bool);
    // Show that === is more strict
    console.log(num === num);
  </script>
</body>

</html>
