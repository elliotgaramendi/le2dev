<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔄 Constantes vs Variables 🔒</title>
</head>

<body>
  <h1>🔄 Constantes vs Variables 🔒</h1>
  <h5>🎯 Descubre la diferencia en la consola 💡</h5>
  <script>
    const yearOfBirth = 1996;
    let age = 29;

    console.log(yearOfBirth);
    console.log(age);

    age = 30;
    // yearOfBirth = 2000;
    console.log(yearOfBirth);
    console.log(age);
  </script>
</body>

</html>
