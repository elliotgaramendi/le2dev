<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 Tipos de Datos Básicos 🌈</title>
</head>

<body>
  <h1>🎨 Tipos de Datos Básicos 🌈</h1>
  <h5>🔍 Explora los diferentes tipos en la consola 📊</h5>
  <script>
    // 📝 String (texto) 👇
    const text = 'JavaScript';

    // 🔢 Number (número) 👇
    const number = 8;


    // ✅ Boolean (verdadero/falso) 👇
    const inLove = true;


    // ❓ Undefined (sin valor) 👇
    // const girfriend;
    let girfriend;

    // ⭕ Null (vacío intencional) 👇
    let isMarried = null;

    // 💬 Muestra todos en consola 👇
    console.log('String:', text);
    console.log('Number:', number);
    console.log('Boolean:', inLove);
    console.log('Undefined:', girfriend);
    console.log('Null:', isMarried);
  </script>
</body>

</html>
