<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎤 Presentación con Template Strings ✨</title>
</head>

<body>
  <h1>🎤 Presentación con Template Strings ✨</h1>
  <h5>💬 Mira tu presentación en la consola 🌟</h5>
  <script>
    const name = 'Fernanda';
    const age = 26;

    // ✨ Crea el mensaje usando template strings (backticks) 👇
    const message = `Hola, soy ${name} y tengo ${age} años`;
    console.log(message);

    // 💬 Muestra el mensaje 👇
    console.log(`Hola, soy ${name} y tengo ${age} años`);
  </script>
</body>

</html>
